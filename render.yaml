services:
  - type: web
    name: afterworld
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-1.5-flash
      - key: MONGODB_URI
        sync: false
      - key: SERPAPI_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
